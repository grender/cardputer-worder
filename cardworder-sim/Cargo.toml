[package]
name = "cardworder-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cardworder-sim"

[dependencies]
cardworder-core            = { path = "../cardworder-core" }
fsrs-core                  = { path = "../fsrs-core" }
sdl2                       = "0.37"
chrono                     = "0.4"
log                        = "0.4"
env_logger                 = "0.11"
postcard                   = { version = "1.1", features = ["alloc"] }
serde                      = { version = "1.0", features = ["derive"] }
dirs                       = "5"
heapless                   = { version = "0.9.0", features = ["serde"] }
embedded-graphics          = "0.8.1"
embedded-graphics-framebuf = "0.5.0"
rs-fsrs                    = "1"
